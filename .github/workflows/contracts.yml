name: contracts

on:
  push:
    paths:
      - "src/Ancorhash.Contracts/**"
      - ".github/workflows/contracts.yml"
  pull_request:
    paths:
      - "src/Ancorhash.Contracts/**"
      - ".github/workflows/contracts.yml"

permissions:
  contents: read

jobs:
  forge:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/Ancorhash.Contracts
    env:
      FOUNDRY_PROFILE: ci
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: foundry-rs/foundry-toolchain@v1

      - name: Check formatting
        run: forge fmt --check

      - name: Build
        run: forge build --sizes

      - name: Test
        run: forge test -vvv
